<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 416" width="880" height="416" role="img" aria-label="Planta da sala do PROTEA-R vista de cima, com a porta de entrada e três ambientes: o chão com brinquedos de faz de conta e potes transparentes fechados, a mesa com encaixes, quebra-cabeças, lápis e papel, e o armário com a caixa opaca do avaliador, fora do alcance da criança">
  <defs>
    <style>
      .tt { font-family: Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #242258; }
      .sb { font-family: Helvetica, Arial, sans-serif; font-size: 13.5px; fill: #63628a; }
      .gd { font-family: Helvetica, Arial, sans-serif; font-size: 13.5px; fill: #6f5a1f; }
      .nm { font-family: Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #fbfaf5; text-anchor: middle; }
      .lg { font-family: Helvetica, Arial, sans-serif; font-size: 14px; fill: #242258; }
    </style>
    <pattern id="piso" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#ece8da" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- contextos da sessão -->
  <rect x="24" y="6" width="300" height="26" rx="13" fill="#947b2f"/>
  <text class="nm" x="174" y="24">brincadeira livre · ≈ 15 min</text>
  <rect x="340" y="6" width="516" height="26" rx="13" fill="#242258"/>
  <text class="nm" x="598" y="24">semiestruturada · ≈ 30 min</text>

  <g transform="translate(0 36)">
  <!-- sala: piso, parede e porta -->
  <rect x="8" y="8" width="864" height="364" fill="#fbfaf5"/>
  <rect x="8" y="8" width="864" height="364" fill="url(#piso)"/>
  <path d="M8 372V8H872V372H100M40 372H8" fill="none" stroke="#242258" stroke-width="5" stroke-linejoin="round"/>
  <path d="M40 372V320A52 52 0 0 1 92 372" fill="#f4f2ea" fill-opacity=".7" stroke="#c3bfb0" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="40" y1="372" x2="40" y2="320" stroke="#242258" stroke-width="3"/>
  <text class="sb" x="106" y="364">porta</text>

  <!-- 01 · o chão -->
  <rect x="24" y="24" width="300" height="276" rx="16" fill="#e7e7f1" stroke="#c3bfb0" stroke-width="1.5"/>
  <circle cx="50" cy="52" r="14" fill="#242258"/><text class="nm" x="50" y="57">1</text>
  <text class="tt" x="74" y="58">O chão</text>
  <text class="sb" x="42" y="86">faz de conta e busca de auxílio</text>
  <!-- mesinha de chá -->
  <circle cx="108" cy="162" r="32" fill="#f1e9d6" stroke="#947b2f" stroke-width="2"/>
  <circle cx="98" cy="154" r="6" fill="#947b2f"/><circle cx="120" cy="156" r="6" fill="#947b2f"/><circle cx="108" cy="176" r="6" fill="#947b2f"/>
  <circle cx="60" cy="162" r="11" fill="#fbfaf5" stroke="#947b2f" stroke-width="2"/>
  <circle cx="156" cy="162" r="11" fill="#fbfaf5" stroke="#947b2f" stroke-width="2"/>
  <!-- carrinhos -->
  <g>
    <rect x="206" y="118" width="52" height="24" rx="9" fill="#4a4880"/>
    <rect x="224" y="123" width="16" height="9" rx="2" fill="#e7e7f1"/>
  </g>
  <g transform="rotate(24 262 176)">
    <rect x="236" y="164" width="52" height="24" rx="9" fill="#947b2f"/>
    <rect x="254" y="169" width="16" height="9" rx="2" fill="#f1e9d6"/>
  </g>
  <!-- bonecos -->
  <circle cx="232" cy="222" r="9" fill="#d9c176" stroke="#947b2f" stroke-width="1.5"/>
  <rect x="223" y="233" width="18" height="28" rx="7" fill="#63628a"/>
  <circle cx="276" cy="232" r="9" fill="#d9c176" stroke="#947b2f" stroke-width="1.5"/>
  <rect x="267" y="243" width="18" height="28" rx="7" fill="#4a4880"/>
  <!-- pote e caixa transparentes, fechados -->
  <rect x="44" y="214" width="66" height="44" rx="7" fill="#ffffff" fill-opacity=".6" stroke="#6f5a1f" stroke-width="2" stroke-dasharray="5 3"/>
  <circle cx="64" cy="244" r="6" fill="#947b2f"/><rect x="76" y="238" width="12" height="12" rx="2" fill="#4a4880"/><circle cx="98" cy="242" r="5" fill="#a3651b"/>
  <rect x="128" y="218" width="48" height="40" rx="5" fill="#ffffff" fill-opacity=".6" stroke="#6f5a1f" stroke-width="2" stroke-dasharray="5 3"/>
  <rect x="140" y="236" width="14" height="14" rx="2" fill="#2c6b4f"/><circle cx="162" cy="244" r="5" fill="#96322c"/>
  <text class="gd" x="42" y="284">pote e caixa transparentes, fechados</text>

  <!-- 02 · a mesa -->
  <rect x="340" y="24" width="250" height="276" rx="16" fill="#f1e9d6" stroke="#c3bfb0" stroke-width="1.5"/>
  <circle cx="366" cy="52" r="14" fill="#242258"/><text class="nm" x="366" y="57">2</text>
  <text class="tt" x="390" y="58">A mesa</text>
  <text class="sb" x="358" y="86">encaixes e material gráfico</text>
  <rect x="396" y="112" width="172" height="100" rx="8" fill="#fbfaf5" stroke="#947b2f" stroke-width="2.5"/>
  <!-- quebra-cabeça e encaixes -->
  <rect x="410" y="124" width="24" height="24" rx="3" fill="#e7e7f1" stroke="#4a4880" stroke-width="1.5"/>
  <rect x="434" y="124" width="24" height="24" rx="3" fill="#d9c176" stroke="#947b2f" stroke-width="1.5"/>
  <rect x="410" y="148" width="24" height="24" rx="3" fill="#f2e6dd" stroke="#a3651b" stroke-width="1.5"/>
  <circle cx="434" cy="148" r="5" fill="#fbfaf5" stroke="#4a4880" stroke-width="1.5"/>
  <circle cx="476" cy="140" r="11" fill="#4a4880"/>
  <polygon points="470,172 482,172 476,158" fill="#947b2f" transform="translate(0 6)"/>
  <rect x="490" y="150" width="20" height="20" rx="3" fill="#2c6b4f"/>
  <!-- papel e lápis -->
  <rect x="520" y="122" width="36" height="52" fill="#ffffff" stroke="#c3bfb0" stroke-width="1.5" transform="rotate(5 538 148)"/>
  <line x1="418" y1="194" x2="462" y2="190" stroke="#2c6b4f" stroke-width="4" stroke-linecap="round"/>
  <line x1="420" y1="202" x2="466" y2="200" stroke="#96322c" stroke-width="4" stroke-linecap="round"/>
  <line x1="476" y1="192" x2="520" y2="196" stroke="#a3651b" stroke-width="4" stroke-linecap="round"/>
  <!-- cadeiras -->
  <circle cx="374" cy="162" r="13" fill="#242258"/>
  <circle cx="482" cy="240" r="13" fill="#947b2f"/>
  <text class="gd" x="358" y="276">a criança senta e sustenta a tarefa</text>

  <!-- 03 · o armário e a caixa -->
  <rect x="606" y="24" width="250" height="276" rx="16" fill="#e3ece4" stroke="#c3bfb0" stroke-width="1.5"/>
  <circle cx="632" cy="52" r="14" fill="#242258"/><text class="nm" x="632" y="57">3</text>
  <text class="tt" x="656" y="58">A caixa do avaliador</text>
  <text class="sb" x="624" y="86">estímulos sensoriais</text>
  <rect x="640" y="106" width="184" height="62" rx="5" fill="#d3ddd5" stroke="#63628a" stroke-width="2"/>
  <text class="sb" x="816" y="162" text-anchor="end" font-size="12">armário</text>
  <rect x="680" y="114" width="84" height="38" rx="5" fill="#242258"/>
  <text class="nm" x="722" y="138">caixa opaca</text>
  <path d="M774 122q9 11 0 22M785 117q13 16 0 32" fill="none" stroke="#6f5a1f" stroke-width="2.5" stroke-linecap="round"/>
  <text class="gd" x="624" y="190">fora do alcance, um item por vez</text>
  <!-- alcance da criança -->
  <circle cx="720" cy="262" r="36" fill="#947b2f" fill-opacity=".12" stroke="#6f5a1f" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="720" cy="262" r="10" fill="#947b2f"/>
  <text class="sb" x="764" y="258">alcance</text>
  <text class="sb" x="764" y="276">da criança</text>

  <!-- entrada -->
  <path d="M66 366V336H120" fill="none" stroke="#6f5a1f" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round"/>
  <polygon points="120,328 134,336 120,344" fill="#6f5a1f"/>
  <circle cx="160" cy="336" r="13" fill="#63628a"/>
  <circle cx="190" cy="341" r="9" fill="#947b2f"/>
  <text class="lg" x="214" y="341">entram primeiro e ficam a sós</text>

  <!-- chave -->
  <circle cx="560" cy="341" r="8" fill="#947b2f"/><text class="lg" x="574" y="346">criança</text>
  <circle cx="650" cy="341" r="9" fill="#63628a"/><text class="lg" x="665" y="346">cuidador</text>
  <circle cx="754" cy="341" r="8" fill="#242258"/><text class="lg" x="768" y="346">avaliador</text>
  </g>
</svg>
