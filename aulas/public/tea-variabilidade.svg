<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 311" width="860" height="311" role="img" aria-label="Tres perfis com o mesmo diagnostico de TEA: um com linguagem ausente e alto apoio, um com linguagem fluente e rigidez marcada, e um com camuflagem social e sobrecarga sensorial">
  <style>
    /* O viewBox acompanha a proporcao do palco do layout `esquema` (860x311),
       para o desenho render 1:1 e o texto nao encolher na projecao. */
    .nm { font-family: Helvetica, Arial, sans-serif; font-size: 14.5px; fill: #242258; }
    .vl { font-family: Helvetica, Arial, sans-serif; font-size: 14px; fill: #242258; }
    /* Rotulo dentro da barra: papel sobre as tres cores de sinal. Os tres
       pares passam de 4.5:1 — por isso o ambar aqui e mais fundo que o
       --ds-warn dos tokens, que so aguenta texto escuro. */
    .vd { font-family: Helvetica, Arial, sans-serif; font-size: 14px; fill: #f4f2ea; }
    .kk { font-family: Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #6f5a1f; letter-spacing: 1.4px; }
    .hd { font-family: Helvetica, Arial, sans-serif; font-size: 15px; fill: #f4f2ea; }
    .cp { font-family: Helvetica, Arial, sans-serif; font-size: 13.5px; fill: #63628a; }
  </style>

  <text class="kk" x="8" y="16">O MESMO DIAGNÓSTICO, TRÊS CRIANÇAS</text>

  <!-- cabeçalhos das três colunas -->
  <rect x="196" y="28" width="214" height="26" fill="#242258"/><text class="hd" x="298" y="46" text-anchor="middle">Criança A · 4 anos</text>
  <rect x="416" y="28" width="214" height="26" fill="#242258"/><text class="hd" x="524" y="46" text-anchor="middle">Criança B · 8 anos</text>
  <rect x="642" y="28" width="214" height="26" fill="#242258"/><text class="hd" x="750" y="46" text-anchor="middle">Criança C · 12 anos</text>

  <!-- nomes dos domínios -->
  <text class="nm" x="8" y="82">Linguagem</text>
  <text class="nm" x="8" y="120">Funcionamento intelectual</text>
  <text class="nm" x="8" y="158">Rigidez e rituais</text>
  <text class="nm" x="8" y="196">Reatividade sensorial</text>
  <text class="nm" x="8" y="234">Adaptação no dia a dia</text>

  <g stroke="#ddd9cb">
    <line x1="190" y1="62" x2="856" y2="62"/><line x1="190" y1="100" x2="856" y2="100"/>
    <line x1="190" y1="138" x2="856" y2="138"/><line x1="190" y1="176" x2="856" y2="176"/>
    <line x1="190" y1="214" x2="856" y2="214"/><line x1="190" y1="252" x2="856" y2="252"/>
  </g>

  <!-- A barra mede o prejuízo: quanto mais longa, maior o prejuízo.
       Rótulo dentro da barra quando ela comporta; ao lado, em tinta, quando não. -->
  <!-- Criança A -->
  <g>
    <rect x="196" y="66" width="200" height="22" fill="#96322c"/><text class="vd" x="196" y="82">sem fala funcional</text>
    <rect x="196" y="104" width="158" height="22" fill="#8a5313"/><text class="vd" x="196" y="120">rebaixado</text>
    <rect x="196" y="142" width="140" height="22" fill="#8a5313"/><text class="vd" x="196" y="158">enfileira objetos</text>
    <rect x="196" y="180" width="200" height="22" fill="#96322c"/><text class="vd" x="196" y="196">cobre os ouvidos</text>
    <rect x="196" y="218" width="192" height="22" fill="#96322c"/><text class="vd" x="196" y="234">apoio muito substancial</text>
  </g>
  <!-- Criança B -->
  <g>
    <rect x="416" y="66" width="56" height="22" fill="#2c6b4f"/><text class="vl" x="480" y="82">fala fluente e formal</text>
    <rect x="416" y="104" width="56" height="22" fill="#2c6b4f"/><text class="vl" x="480" y="120">na média</text>
    <rect x="416" y="142" width="200" height="22" fill="#96322c"/><text class="vd" x="422" y="158">sofre com qualquer mudança</text>
    <rect x="416" y="180" width="100" height="22" fill="#8a5313"/><text class="vl" x="524" y="196">evita texturas</text>
    <rect x="416" y="218" width="100" height="22" fill="#8a5313"/><text class="vl" x="524" y="234">apoio na escola</text>
  </g>
  <!-- Criança C -->
  <g>
    <rect x="642" y="66" width="56" height="22" fill="#2c6b4f"/><text class="vl" x="706" y="82">sem atraso</text>
    <rect x="642" y="104" width="56" height="22" fill="#2c6b4f"/><text class="vl" x="706" y="120">acima da média</text>
    <rect x="642" y="142" width="88" height="22" fill="#8a5313"/><text class="vl" x="738" y="158">rotinas próprias</text>
    <rect x="642" y="180" width="168" height="22" fill="#96322c"/><text class="vd" x="648" y="196">exausta ao fim do dia</text>
    <rect x="642" y="218" width="116" height="22" fill="#8a5313"/><text class="vl" x="766" y="234">custa caro</text>
  </g>

  <text class="cp" x="8" y="278">A barra mede o <tspan fill="#242258">prejuízo</tspan>, não o traço. As três preenchem os critérios A e B — e nenhuma se parece com as outras.</text>
  <text class="cp" x="8" y="298">É por isso que a palavra do diagnóstico é <tspan fill="#242258">espectro</tspan>, e por isso que um único instrumento não dá conta.</text>
</svg>
